name: quality

on:
  pull_request:
  push:
  merge_group:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Locked restore, build, format, tests, audit and 87 percent coverage
        shell: pwsh
        run: ./scripts/Invoke-Quality.ps1 -Platform '${{ matrix.platform }}'
      - name: Diagnose bounded private VHD formatting after native failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Measure-WindowsVolumeFormatting.ps1
      - name: Pack and consume local library packages
        shell: pwsh
        run: |
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { throw 'Pinned tool restore failed.' }
          dotnet pack Monstertacle.Multisession.slnx -c Release --no-build -o artifacts/packages
          if ($LASTEXITCODE -ne 0) { throw 'Local package build failed.' }
          ./eng/PackageSmoke.ps1
      - name: Publish and validate native host outside the source tree
        shell: pwsh
        run: |
          $framework = if ($IsWindows) { 'net10.0-windows' } else { 'net10.0' }
          $rid = if ($IsWindows) { 'win-x64' } else { 'linux-x64' }
          $publish = "artifacts/publish/$rid"
          dotnet publish examples/Monstertacle.Multisession.ValidationHost -c Release -f $framework -r $rid --self-contained false --no-restore -o $publish
          if ($LASTEXITCODE -ne 0) { throw 'Native framework-dependent publish failed.' }
          $outside = Join-Path ([Environment]::GetFolderPath('UserProfile')) ('dev/.agenttemp/multisession-publish-' + [Guid]::NewGuid().ToString('N'))
          $null = New-Item -Path $outside -ItemType Directory
          Get-ChildItem -LiteralPath $publish -Force | Copy-Item -Destination $outside -Recurse
          ./eng/Invoke-ValidationScenarios.ps1 -HostAssembly (Join-Path $outside 'Monstertacle.Multisession.ValidationHost.dll')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-${{ matrix.platform }}
          path: artifacts/quality/${{ matrix.platform }}/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packages-and-consumer-${{ matrix.platform }}
          path: |
            artifacts/packages/
            artifacts/package-smoke/
            artifacts/publish/
            artifacts/validation-scenarios/
          if-no-files-found: error

  canonical-consumer:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: packages-and-consumer-linux
          path: artifacts/canonical-input
      - name: Verify and consume identical producer package bytes
        shell: pwsh
        run: |
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { throw 'Pinned tool restore failed.' }
          $manifests = @(Get-ChildItem artifacts/canonical-input/package-smoke -Filter manifest.json -Recurse -File)
          if ($manifests.Count -ne 1) { throw 'Expected exactly one successful package producer manifest.' }
          ./eng/Test-CanonicalPackageHashes.ps1 -ProducerManifest $manifests[0].FullName -PackageDirectory artifacts/canonical-input/packages > artifacts/canonical-package-source.json
          ./eng/PackageSmoke.ps1 -PackageDirectory artifacts/canonical-input/packages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-consumer-${{ matrix.platform }}
          path: |
            artifacts/canonical-package-source.json
            artifacts/package-smoke/
          if-no-files-found: error
