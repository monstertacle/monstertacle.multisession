name: quality

on:
  pull_request:
  push:
  merge_group:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Locked restore, build, format, tests, audit and 87 percent coverage
        shell: pwsh
        run: ./scripts/Invoke-Quality.ps1 -Platform '${{ matrix.platform }}'
      - name: Diagnose bounded private VHD formatting after native failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Measure-WindowsVolumeFormatting.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-${{ matrix.platform }}
          path: artifacts/quality/${{ matrix.platform }}/
          if-no-files-found: error
