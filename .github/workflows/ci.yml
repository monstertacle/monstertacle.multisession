name: quality

on:
  pull_request:
  push:
  merge_group:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Locked restore, build, format, tests, audit and 87 percent coverage
        shell: pwsh
        run: ./scripts/Invoke-Quality.ps1 -Platform '${{ matrix.platform }}'
      - name: Diagnose bounded private VHD formatting after native failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Measure-WindowsVolumeFormatting.ps1
      - name: Pack and consume local library packages
        shell: pwsh
        run: |
          dotnet pack Monstertacle.Multisession.slnx -c Release --no-build -o artifacts/packages -p:PackageVersion=0.1.0
          if ($LASTEXITCODE -ne 0) { throw 'Local package build failed.' }
          ./eng/PackageSmoke.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-${{ matrix.platform }}
          path: artifacts/quality/${{ matrix.platform }}/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packages-and-consumer-${{ matrix.platform }}
          path: |
            artifacts/packages/
            artifacts/package-smoke/
          if-no-files-found: error
