name: windows-recovery-diagnosis
on:
  push:
    branches: [diagnostics/windows-recovery-20261029]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        probe: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build the instrumented native probe
        shell: pwsh
        run: |
          dotnet restore Monstertacle.Multisession.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Locked restore failed.' }
          dotnet publish examples/Monstertacle.Multisession.ValidationHost -c Release -f net10.0-windows -r win-x64 --self-contained false --no-restore -o artifacts/diagnostic-host
          if ($LASTEXITCODE -ne 0) { throw 'Native probe publish failed.' }
      - name: Repeat unchanged kill and reopen assertions
        shell: pwsh
        run: |
          $base = Join-Path $env:USERPROFILE 'dev/.agenttemp'
          $null = New-Item $base -ItemType Directory -Force
          $null = New-Item artifacts/diagnosis -ItemType Directory -Force
          $hostPath = (Resolve-Path artifacts/diagnostic-host/Monstertacle.Multisession.ValidationHost.dll).Path
          for ($iteration = 0; $iteration -lt 30; $iteration++) {
            $state = Join-Path $base ('recovery-diagnosis-' + [Guid]::NewGuid().ToString('N'))
            $report = "artifacts/diagnosis/report-$iteration.json"
            $errors = "artifacts/diagnosis/phases-$iteration.log"
            dotnet $hostPath --scenario recovery --state-root $state > $report 2> $errors
            $exit = $LASTEXITCODE
            Get-Content $errors
            Get-Content $report
            if ($exit -ne 0) { throw "Native diagnosis failed at repetition $iteration, state $state." }
            $parsed = Get-Content -Raw $report | ConvertFrom-Json
            if ($parsed.Status -ne 'PASS') { throw 'Native scenario did not pass.' }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-recovery-diagnosis-${{ matrix.probe }}
          path: artifacts/diagnosis/
          if-no-files-found: error
